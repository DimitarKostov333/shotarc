name: Deploy to VPS

# Manual only. Builds a signed APK and ships it, the server and the nginx site to the VPS. Never
# fires on its own, because it touches a production box that also runs another site.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to push to the production VPS'
        required: true
        default: ''

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the platform this project builds against
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write the shared secrets file (used by the build and pushed to the server)
        env:
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
        run: |
          mkdir -p deploy
          {
            printf 'INGEST_KEY=%s\n' "$INGEST_KEY"
            printf 'DASHBOARD_KEY=%s\n' "$DASHBOARD_KEY"
          } > deploy/shotarc.env

      - name: Build signed release APK
        env:
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PgolfKeystore="$RUNNER_TEMP/release.jks" \
            -PgolfKeystorePassword="$KS_PASS" \
            -PgolfKeyAlias="$KEY_ALIAS" \
            -PgolfKeyPassword="$KEY_PASS"

      - name: Load the VPS deploy key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${VPS_HOST#*@}" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host shotarc-vps
              HostName ${VPS_HOST#*@}
              User ${VPS_HOST%@*}
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
          EOF

      - name: Provision (idempotent) and deploy
        run: |
          ./deploy/provision.sh shotarc-vps
          ./deploy/deploy.sh shotarc-vps
