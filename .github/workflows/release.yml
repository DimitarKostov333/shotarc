name: Release

# Push a version tag (v1.0, v1.1, …) to build a signed release APK and attach it to a GitHub
# Release. The install page on the VPS serves whatever APK a deploy pushes; this is how you cut
# the build that gets deployed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write        # needed to create the Release

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the platform this project builds against
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing keystore from a secret
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set — add it in Settings → Secrets"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Provide the ingest secret to the build
        env:
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          mkdir -p deploy
          printf 'INGEST_KEY=%s\n' "$INGEST_KEY" > deploy/shotarc.env

      - name: Build signed release APK
        env:
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PgolfKeystore="$RUNNER_TEMP/release.jks" \
            -PgolfKeystorePassword="$KS_PASS" \
            -PgolfKeyAlias="$KEY_ALIAS" \
            -PgolfKeyPassword="$KEY_PASS"

      - name: Name the artifact after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "shotarc-${GITHUB_REF_NAME}.apk"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "shotarc-${GITHUB_REF_NAME}.apk" \
            --title "ShotArc $GITHUB_REF_NAME" \
            --generate-notes
