# ShotArc — a new server block for the existing nginx on this box. It only answers for
# shotarc.co.za, so the site already running here is untouched. certbot rewrites this file to add
# the TLS lines and the :443 block once a certificate has been issued.
server {
    listen 80;
    listen [::]:80;
    server_name shotarc.co.za www.shotarc.co.za;

    # The APK is large; let it through without buffering games.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
